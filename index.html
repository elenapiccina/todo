<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks For Today ⚡️</title>
    <style>
        :root {
            --pink-accent: #FFB9D2;
            --cream-bg:#FFF0F3;
            --text-dark: #524749;
            --text-muted: #A39295;
            --card-white: #FAFAFA;
        }

        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            background-color: transparent;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
        }

        .widget-container {
            width: 100%;
            max-width: 480px;
            background: var(--cream-bg);
            border-radius: 16px;
            border: 1px solid rgba(248, 187, 208, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            box-sizing: border-box;
        }

        .header-bar {
            background-color: var(--pink-accent);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .btn-clear {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            opacity: 0.9;
        }
        .btn-clear:hover { opacity: 1; text-decoration: underline; }

        .content-area { padding: 16px; }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        input {
            flex: 1;
            border: 1px solid rgba(248, 187, 208, 0.4);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-family: inherit;
            color: var(--text-dark);
            outline: none;
            background: var(--card-white);
        }

        .btn-add {
            background-color: var(--pink-accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-size: 0.85rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--card-white);
            border-radius: 10px;
            border: 1px solid rgba(248, 187, 208, 0.15);
        }

        .check-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--pink-accent);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .check-circle.completed { background: var(--pink-accent); }
        .check-circle.completed::after { content: "✓"; color: white; font-size: 0.7rem; }

        .task-name { font-size: 0.95rem; color: var(--text-dark); }
        .task-name.completed { color: var(--text-muted); text-decoration: line-through; opacity: 0.6; }

        .btn-delete { background: none; border: none; color: #E0D5D7; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="widget-container">
    <div class="header-bar">
        <div class="header-title">Tasks For Today ⚡️</div>
        <button class="btn-clear" onclick="clearAll()">Clear Completed</button>
    </div>
    <div class="content-area">
        <div class="input-row">
            <input type="text" id="taskInput" placeholder="Add a task...">
            <button class="btn-add" onclick="addTask()">Add</button>
        </div>
        <div class="task-list" id="taskList"></div>
    </div>
</div>

<script>
    let todoItems = JSON.parse(localStorage.getItem('notion_separate_checklist')) || [];

    function saveAndRender() {
        localStorage.setItem('notion_separate_checklist', JSON.stringify(todoItems));
        const listEl = document.getElementById('taskList');
        listEl.innerHTML = '';
        todoItems.forEach(item => {
            const row = document.createElement('div');
            row.className = 'task-item';
            row.innerHTML = `
                <div style="display:flex; align-items:center; gap:12px;">
                    <button class="check-circle ${item.completed ? 'completed' : ''}" onclick="toggleTask(${item.id})"></button>
                    <span class="task-name ${item.completed ? 'completed' : ''}">${item.text}</span>
                </div>
                <button class="btn-delete" onclick="deleteTask(${item.id})">✕</button>
            `;
            listEl.appendChild(row);
        });
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        if (!input.value.trim()) return;
        todoItems.push({ id: Date.now(), text: input.value.trim(), completed: false });
        input.value = '';
        saveAndRender();
    }

    function toggleTask(id) {
        const item = todoItems.find(t => t.id === id);
        if (item) { item.completed = !item.completed; saveAndRender(); }
    }

    function deleteTask(id) { todoItems = todoItems.filter(t => t.id !== id); saveAndRender(); }
    function clearAll() { todoItems = todoItems.filter(t => !t.completed); saveAndRender(); }

    document.getElementById('taskInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addTask();
    });
    saveAndRender();
</script>
</body>
</html>
